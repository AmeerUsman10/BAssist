name: Train GPT-2

on:
  push:
    branches: [main]
    paths:
      - "train_gpt2.py"
      - "requirements.txt"
      - "data/train.jsonl"
      - ".github/workflows/train-gpt2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt2-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Record runner resources
        run: |
          python --version
          python - <<'PY'
          import os
          import platform
          import torch
          print("platform:", platform.platform())
          print("cpu_count:", os.cpu_count())
          print("torch:", torch.__version__)
          print("cuda_available:", torch.cuda.is_available())
          PY

      - name: Fine-tune and evaluate GPT-2
        id: train
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          python train_gpt2.py 2>&1 | tee training.log

      - name: Verify output package
        if: steps.train.outcome == 'success'
        run: |
          test -f outputs/gpt2-tuned/model.safetensors
          test -f outputs/gpt2-tuned/training_summary.json
          test -f outputs/gpt2-tuned/sample_comparison.txt
          du -sh outputs/gpt2-tuned
          cat outputs/gpt2-tuned/training_summary.json

      - name: Upload tuned model
        if: steps.train.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-tuned-model
          path: outputs/gpt2-tuned/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Write execution receipt
        if: always()
        env:
          TRAIN_OUTCOME: ${{ steps.train.outcome }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports")
          output = Path("outputs/gpt2-tuned")
          outcome = os.environ.get("TRAIN_OUTCOME", "unknown")
          receipt = {
              "status": outcome,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "model_artifact": "gpt2-tuned-model" if outcome == "success" else None,
          }
          (reports / "latest-status.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          if (output / "training_summary.json").exists():
              shutil.copy2(output / "training_summary.json", reports / "latest-training-summary.json")
          if (output / "sample_comparison.txt").exists():
              shutil.copy2(output / "sample_comparison.txt", reports / "latest-sample-comparison.txt")
          log_path = Path("training.log")
          if log_path.exists():
              lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
              (reports / "latest-training-log-tail.txt").write_text(
                  "\n".join(lines[-300:]) + "\n", encoding="utf-8"
              )
          PY

      - name: Publish execution receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Record GPT-2 training run ${GITHUB_RUN_ID}" || true
          git push

      - name: Propagate training failure
        if: steps.train.outcome != 'success'
        run: exit 1
