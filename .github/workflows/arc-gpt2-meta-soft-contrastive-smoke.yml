name: ARC-GPT2 Contrastive Soft Memory Smoke

on:
  workflow_dispatch:
  push:
    branches: [arc-gpt2-programs]
    paths:
      - "arcgpt2/meta_soft_contrastive.py"
      - "arcgpt2/tests/test_meta_soft_contrastive.py"
      - ".github/workflows/arc-gpt2-meta-soft-contrastive-smoke.yml"

permissions:
  contents: write

concurrency:
  group: arc-gpt2-meta-soft-contrastive-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      ARC_GPT2_META_MAX_PROBES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4" pytest

      - name: Run matched contrastive runtime experiment
        id: experiment
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pytest -q arcgpt2/tests
            python -m arcgpt2.meta_soft_contrastive \
              --initialization pretrained \
              --output-dir outputs/meta_soft_contrastive_smoke/pretrained \
              --train-groups 2 \
              --train-mapping-variants 2 \
              --validation-groups 1 \
              --validation-mapping-variants 2 \
              --max-length 256 \
              --prefix-length 4 \
              --inner-learning-rate 0.2 \
              --outer-learning-rate 0.00005 \
              --episodes-per-outer-step 1 \
              --max-outer-steps 1 \
              --warmup-steps 1 \
              --freeze-first-n-blocks 11 \
              --no-query-after-every-probe \
              --evaluation-groups 1 \
              --no-save-model
            python -m arcgpt2.meta_soft_contrastive \
              --initialization random \
              --output-dir outputs/meta_soft_contrastive_smoke/random \
              --train-groups 2 \
              --train-mapping-variants 2 \
              --validation-groups 1 \
              --validation-mapping-variants 2 \
              --max-length 256 \
              --prefix-length 4 \
              --inner-learning-rate 0.2 \
              --outer-learning-rate 0.00005 \
              --episodes-per-outer-step 1 \
              --max-outer-steps 1 \
              --warmup-steps 1 \
              --freeze-first-n-blocks 11 \
              --no-query-after-every-probe \
              --evaluation-groups 1 \
              --no-save-model
            python -m arcgpt2.compare_meta_soft \
              --pretrained outputs/meta_soft_contrastive_smoke/pretrained/summary.json \
              --random outputs/meta_soft_contrastive_smoke/random/summary.json \
              --output outputs/meta_soft_contrastive_smoke/comparison.json
          } 2>&1 | tee meta-soft-contrastive-smoke.log

      - name: Write durable evidence
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          mkdir -p reports/arcgpt2
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/arcgpt2")
          outputs = Path("outputs/meta_soft_contrastive_smoke")
          receipt = {
              "status": os.environ.get("EXPERIMENT_OUTCOME", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "scope": (
                  "One-step contrastive second-order soft-memory runtime smoke; "
                  "not an ARC-AGI-3 capability result"
              ),
          }
          (reports / "latest-meta-soft-contrastive-smoke-status.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          copies = {
              outputs / "pretrained" / "summary.json": reports / "latest-meta-soft-contrastive-smoke-pretrained.json",
              outputs / "random" / "summary.json": reports / "latest-meta-soft-contrastive-smoke-random.json",
              outputs / "comparison.json": reports / "latest-meta-soft-contrastive-smoke-comparison.json",
          }
          for source, target in copies.items():
              if source.exists():
                  shutil.copy2(source, target)
          log = Path("meta-soft-contrastive-smoke.log")
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              (reports / "latest-meta-soft-contrastive-smoke-log-tail.txt").write_text(
                  "\n".join(lines[-1400:]) + "\n", encoding="utf-8"
              )
          PY

      - name: Publish evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2/
          git commit -m "Record contrastive GPT-2 soft memory ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Propagate failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
