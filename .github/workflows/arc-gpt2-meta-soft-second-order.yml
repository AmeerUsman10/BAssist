name: ARC-GPT2 Second-Order Soft Memory

on:
  workflow_dispatch:
  push:
    branches: [arc-gpt2-programs]
    paths:
      - "arcgpt2/meta_soft_second_order.py"
      - "arcgpt2/compare_meta_soft.py"
      - "arcgpt2/tests/test_meta_soft_second_order.py"
      - ".github/workflows/arc-gpt2-meta-soft-second-order.yml"

permissions:
  contents: write

concurrency:
  group: arc-gpt2-meta-soft-second-order-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      ARC_GPT2_META_MAX_PROBES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4" pytest

      - name: Run matched second-order runtime experiment
        id: experiment
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pytest -q arcgpt2/tests
            python -m arcgpt2.meta_soft_second_order \
              --initialization pretrained \
              --output-dir outputs/meta_soft_second_order/pretrained \
              --train-groups 2 \
              --train-mapping-variants 2 \
              --validation-groups 1 \
              --validation-mapping-variants 2 \
              --max-length 256 \
              --prefix-length 4 \
              --inner-learning-rate 0.2 \
              --outer-learning-rate 0.00005 \
              --episodes-per-outer-step 1 \
              --max-outer-steps 1 \
              --warmup-steps 1 \
              --freeze-first-n-blocks 11 \
              --no-query-after-every-probe \
              --evaluation-groups 1 \
              --no-save-model
            python -m arcgpt2.meta_soft_second_order \
              --initialization random \
              --output-dir outputs/meta_soft_second_order/random \
              --train-groups 2 \
              --train-mapping-variants 2 \
              --validation-groups 1 \
              --validation-mapping-variants 2 \
              --max-length 256 \
              --prefix-length 4 \
              --inner-learning-rate 0.2 \
              --outer-learning-rate 0.00005 \
              --episodes-per-outer-step 1 \
              --max-outer-steps 1 \
              --warmup-steps 1 \
              --freeze-first-n-blocks 11 \
              --no-query-after-every-probe \
              --evaluation-groups 1 \
              --no-save-model
            python -m arcgpt2.compare_meta_soft \
              --pretrained outputs/meta_soft_second_order/pretrained/summary.json \
              --random outputs/meta_soft_second_order/random/summary.json \
              --output outputs/meta_soft_second_order/comparison.json
          } 2>&1 | tee meta-soft-second-order.log

      - name: Write durable evidence
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          mkdir -p reports/arcgpt2
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/arcgpt2")
          outputs = Path("outputs/meta_soft_second_order")
          receipt = {
              "status": os.environ.get("EXPERIMENT_OUTCOME", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "scope": (
                  "One-support-step matched second-order soft-memory runtime "
                  "experiment; not an ARC-AGI-3 capability result"
              ),
          }
          (reports / "latest-meta-soft-second-order-status.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          copies = {
              outputs / "pretrained" / "summary.json": reports / "latest-meta-soft-second-order-pretrained.json",
              outputs / "random" / "summary.json": reports / "latest-meta-soft-second-order-random.json",
              outputs / "comparison.json": reports / "latest-meta-soft-second-order-comparison.json",
          }
          for source, target in copies.items():
              if source.exists():
                  shutil.copy2(source, target)
          log = Path("meta-soft-second-order.log")
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              (reports / "latest-meta-soft-second-order-log-tail.txt").write_text(
                  "\n".join(lines[-1400:]) + "\n", encoding="utf-8"
              )
          PY

      - name: Publish evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2/
          git commit -m "Record GPT-2 second-order soft memory ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-gpt2-meta-soft-second-order-evidence
          path: |
            reports/arcgpt2/
            outputs/meta_soft_second_order/pretrained/summary.json
            outputs/meta_soft_second_order/random/summary.json
            outputs/meta_soft_second_order/comparison.json
            meta-soft-second-order.log
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
