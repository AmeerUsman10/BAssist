name: ARC-GPT2 Counterfactual Epistemic Smoke

on:
  workflow_dispatch:
  push:
    branches: [arc-gpt2-programs]
    paths:
      - "arcgpt2/build_epistemic_counterfactual_dataset.py"
      - "arcgpt2/tests/test_epistemic_counterfactual_dataset.py"
      - "arcgpt2/train_epistemic_binding.py"
      - "arcgpt2/compare_epistemic_binding.py"
      - ".github/workflows/arc-gpt2-epistemic-counterfactual.yml"

permissions:
  contents: write

concurrency:
  group: arc-gpt2-counterfactual-epistemic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4" pytest

      - name: Run counterfactual-twin smoke experiment
        id: experiment
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          {
            python -m pytest -q arcgpt2/tests
            python -m arcgpt2.build_epistemic_counterfactual_dataset \
              --output-dir outputs/epistemic_counterfactual/data \
              --train-groups 8 \
              --validation-groups 2 \
              --test-groups 2 \
              --mapping-variants-per-group 4 \
              --seed-base 314159
            # Existing evaluation groups by game_seed. Give every mapping variant
            # a unique evaluation id while retaining counterfactual_group_seed.
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/epistemic_counterfactual/data")
          for split in ("train", "validation", "test"):
              path = root / f"{split}.jsonl"
              rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines()]
              for row in rows:
                  row["game_seed"] = (
                      int(row["counterfactual_group_seed"]) * 100
                      + int(row["mapping_variant_index"])
                  )
              path.write_text(
                  "".join(json.dumps(row, sort_keys=True) + "\n" for row in rows),
                  encoding="utf-8",
              )
          PY
            python -m arcgpt2.train_epistemic_binding \
              --initialization pretrained \
              --data-dir outputs/epistemic_counterfactual/data \
              --output-dir outputs/epistemic_counterfactual/pretrained \
              --max-length 448 \
              --prefix-keep 96 \
              --batch-size 2 \
              --gradient-accumulation-steps 2 \
              --learning-rate 0.00008 \
              --max-optimizer-steps 12 \
              --warmup-steps 2 \
              --freeze-first-n-blocks 8 \
              --evaluation-games 4 \
              --no-save-model
            python -m arcgpt2.train_epistemic_binding \
              --initialization random \
              --data-dir outputs/epistemic_counterfactual/data \
              --output-dir outputs/epistemic_counterfactual/random \
              --max-length 448 \
              --prefix-keep 96 \
              --batch-size 2 \
              --gradient-accumulation-steps 2 \
              --learning-rate 0.00008 \
              --max-optimizer-steps 12 \
              --warmup-steps 2 \
              --freeze-first-n-blocks 8 \
              --evaluation-games 4 \
              --no-save-model
            python -m arcgpt2.compare_epistemic_binding \
              --pretrained outputs/epistemic_counterfactual/pretrained/summary.json \
              --random outputs/epistemic_counterfactual/random/summary.json \
              --output outputs/epistemic_counterfactual/comparison.json
          } 2>&1 | tee counterfactual-epistemic.log

      - name: Write durable evidence
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          mkdir -p reports/arcgpt2
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/arcgpt2")
          outputs = Path("outputs/epistemic_counterfactual")
          receipt = {
              "status": os.environ.get("EXPERIMENT_OUTCOME", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "scope": (
                  "CPU smoke-scale counterfactual-twin set-valued action binding; "
                  "not ARC-AGI-3 evaluation"
              ),
          }
          (reports / "latest-counterfactual-epistemic-status.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          copies = {
              outputs / "data" / "manifest.json": reports / "latest-counterfactual-epistemic-data-manifest.json",
              outputs / "pretrained" / "summary.json": reports / "latest-counterfactual-epistemic-pretrained.json",
              outputs / "random" / "summary.json": reports / "latest-counterfactual-epistemic-random.json",
              outputs / "comparison.json": reports / "latest-counterfactual-epistemic-comparison.json",
          }
          for source, target in copies.items():
              if source.exists():
                  shutil.copy2(source, target)
          log = Path("counterfactual-epistemic.log")
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              (reports / "latest-counterfactual-epistemic-log-tail.txt").write_text(
                  "\n".join(lines[-1000:]) + "\n", encoding="utf-8"
              )
          PY

      - name: Publish evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2/
          git commit -m "Record ARC-GPT2 counterfactual run ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-gpt2-counterfactual-epistemic-evidence
          path: |
            reports/arcgpt2/
            outputs/epistemic_counterfactual/data/manifest.json
            outputs/epistemic_counterfactual/pretrained/summary.json
            outputs/epistemic_counterfactual/random/summary.json
            outputs/epistemic_counterfactual/comparison.json
            counterfactual-epistemic.log
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
