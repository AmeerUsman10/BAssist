name: Instella Action Replication Actual Monitor

on:
  workflow_dispatch:
  push:
    branches: [instella-arc]
    paths:
      - "instella_arc/kaggle/replication_actual_monitor_requests/**"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet --upgrade kaggle

      - name: Query title-normalized private kernel
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          slug = "instella-arc-action-replication-64"
          listing = subprocess.run(
              ["kaggle", "kernels", "list", "--mine", "--page-size", "100", "-v"],
              text=True,
              capture_output=True,
              timeout=180,
          )
          refs = sorted(set(re.findall(
              rf"([A-Za-z0-9_-]+/{re.escape(slug)})",
              listing.stdout + "\n" + listing.stderr,
              flags=re.IGNORECASE,
          )))
          report = {
              "schema": "instella_arc.action_replication_actual_monitor.v1",
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "kernel_slug": slug,
              "kernel_match_count": len(refs),
              "kernel_ref_resolved": len(refs) == 1,
              "status": "not_found",
              "status_exit_code": None,
              "sanitized_output": "",
              "mutated_kaggle": False,
              "github_branch": os.environ.get("GITHUB_REF_NAME"),
              "github_commit_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }
          if len(refs) == 1:
              actual_ref = refs[0]
              owner = actual_ref.split("/", 1)[0]
              process = subprocess.run(
                  ["kaggle", "kernels", "status", actual_ref],
                  text=True,
                  capture_output=True,
                  timeout=180,
              )
              raw = (process.stdout + "\n" + process.stderr).strip()
              sanitized = raw.replace(actual_ref, f"<redacted>/{slug}")
              sanitized = re.sub(
                  rf"(?<![A-Za-z0-9_-]){re.escape(owner)}(?![A-Za-z0-9_-])",
                  "<redacted>",
                  sanitized,
                  flags=re.IGNORECASE,
              )
              lowered = raw.lower()
              report["status_exit_code"] = process.returncode
              report["sanitized_output"] = sanitized[-4000:]
              if process.returncode != 0:
                  report["status"] = "query_failure"
              elif any(word in lowered for word in ("complete", "success")):
                  report["status"] = "complete"
              elif any(word in lowered for word in ("running", "queued", "pending")):
                  report["status"] = "running"
              elif any(word in lowered for word in ("error", "failed", "cancelled")):
                  report["status"] = "failure"
              else:
                  report["status"] = "unknown"
          Path("reports/instella_arc").mkdir(parents=True, exist_ok=True)
          Path("reports/instella_arc/latest-action-replication-actual-monitor.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Publish redacted snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/instella_arc/latest-action-replication-actual-monitor.json
          git commit -m "Record actual Instella replication status ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
