name: ARC-GPT2 Stage 0.2 Mapping Micro

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arc-gpt2-stage02-mapping-micro.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-gpt2-stage02-mapping-micro
  cancel-in-progress: true

jobs:
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4"
      - name: Run mapping-only diagnostic
        id: experiment
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          {
            python -m arcgpt2.stage02_decomposed \
              --output-dir outputs/stage02-mapping/data \
              --train-games 1 \
              --validation-games 1 \
              --test-games 1 \
              --train-seed-start 0 \
              --validation-seed-start 0 \
              --test-seed-start 20
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/stage02-mapping/data")
          for name in ("train", "validation"):
              source = root / f"{name}.jsonl"
              target = root / f"{name}-mapping.jsonl"
              rows = []
              for line in source.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if row.get("task") == "mapping":
                      rows.append(row)
              target.write_text(
                  "".join(json.dumps(row, sort_keys=True) + "\n" for row in rows),
                  encoding="utf-8",
              )
              print(name, len(rows))
          PY
            python -m arcgpt2.train_stage02 \
              --train-file outputs/stage02-mapping/data/train-mapping.jsonl \
              --evaluation-file outputs/stage02-mapping/data/validation-mapping.jsonl \
              --output-dir outputs/stage02-mapping/pretrained \
              --max-length 256 \
              --prefix-keep 128 \
              --train-batch-size 4 \
              --eval-batch-size 16 \
              --gradient-accumulation-steps 1 \
              --learning-rate 1e-4 \
              --max-optimizer-steps 40 \
              --warmup-steps 4 \
              --freeze-first-n-blocks 10 \
              --train-eval-seed-start 0 \
              --train-eval-games 1 \
              --heldout-seed-start 20 \
              --heldout-games 1 \
              --max-actions-per-game 1 \
              --history-modes intact
          } 2>&1 | tee stage02-mapping.log
      - name: Write receipt
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          python -m arcgpt2.report_experiment \
            --report-dir reports/arcgpt2-stage02-mapping \
            --summary outputs/stage02-mapping/pretrained/summary.json \
            --manifest outputs/stage02-mapping/data/manifest.json \
            --log stage02-mapping.log \
            --scope "Stage-0.2 one-game mapping-only overfit diagnostic; not an ARC score"
      - name: Publish receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2-stage02-mapping/
          git commit -m "Record ARC-GPT2 Stage-0.2 mapping micro ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Propagate failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
