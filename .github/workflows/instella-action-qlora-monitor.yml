name: Instella Action QLoRA Monitor

on:
  workflow_dispatch:
  push:
    branches: [instella-arc]
    paths:
      - "instella_arc/kaggle/qlora_monitor_requests/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: instella-action-qlora-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GH_READ_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet --upgrade kaggle

      - name: Snapshot QLoRA workflow and private kernel
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          workflow = "instella-action-qlora-kaggle.yml"
          request = Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{workflow}/runs?branch=instella-arc&per_page=10",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_READ_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "BAssist-Instella-QLoRA-Monitor",
              },
          )
          with urlopen(request, timeout=60) as response:
              payload = json.load(response)
          runs = [
              {
                  "id": run.get("id"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "run_number": run.get("run_number"),
                  "run_attempt": run.get("run_attempt"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              }
              for run in payload.get("workflow_runs", [])
          ]

          slug = "instella-arc-action-qlora-v1"
          listing = subprocess.run(
              ["kaggle", "kernels", "list", "--mine", "--page-size", "100", "-v"],
              text=True,
              capture_output=True,
              timeout=180,
          )
          refs = sorted(set(re.findall(
              rf"([A-Za-z0-9_-]+/{re.escape(slug)})",
              listing.stdout + "\n" + listing.stderr,
              flags=re.IGNORECASE,
          )))
          kaggle = {
              "list_exit_code": listing.returncode,
              "kernel_slug": slug,
              "kernel_match_count": len(refs),
              "kernel_ref_resolved": len(refs) == 1,
              "status": "not_found",
              "status_exit_code": None,
              "sanitized_output": "",
          }
          if len(refs) == 1:
              actual_ref = refs[0]
              owner = actual_ref.split("/", 1)[0]
              process = subprocess.run(
                  ["kaggle", "kernels", "status", actual_ref],
                  text=True,
                  capture_output=True,
                  timeout=180,
              )
              raw = (process.stdout + "\n" + process.stderr).strip()
              sanitized = raw.replace(actual_ref, f"<redacted>/{slug}")
              sanitized = re.sub(
                  rf"(?<![A-Za-z0-9_-]){re.escape(owner)}(?![A-Za-z0-9_-])",
                  "<redacted>",
                  sanitized,
                  flags=re.IGNORECASE,
              )
              lowered = raw.lower()
              kaggle["status_exit_code"] = process.returncode
              kaggle["sanitized_output"] = sanitized[-4000:]
              if process.returncode != 0:
                  kaggle["status"] = "query_failure"
              elif any(word in lowered for word in ("complete", "success")):
                  kaggle["status"] = "complete"
              elif any(word in lowered for word in ("running", "queued", "pending")):
                  kaggle["status"] = "running"
              elif any(word in lowered for word in ("error", "failed", "cancelled")):
                  kaggle["status"] = "failure"
              else:
                  kaggle["status"] = "unknown"

          report = {
              "schema": "instella_arc.action_qlora_monitor.v1",
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "latest_github_run": runs[0] if runs else None,
              "recent_github_runs": runs,
              "kaggle": kaggle,
              "mutated_kaggle": False,
              "github_branch": os.environ.get("GITHUB_REF_NAME"),
              "github_commit_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }
          Path("reports/instella_arc").mkdir(parents=True, exist_ok=True)
          Path("reports/instella_arc/latest-action-qlora-monitor.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "latest_github_run": report["latest_github_run"],
              "kaggle": report["kaggle"],
          }, indent=2))
          PY

      - name: Publish redacted monitor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/instella_arc/latest-action-qlora-monitor.json
          git commit -m "Record Instella QLoRA monitor ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
