name: ARC-GPT2 Stage 0.1 Micro Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arc-gpt2-stage01-micro-monitor.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read latest micro workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/arcgpt2-stage01-micro
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/arc-gpt2-stage01-micro.yml/runs?per_page=5" \
            --jq '{queried_at: now | todate, runs: [.workflow_runs[] | {id, run_number, status, conclusion, head_sha, created_at, updated_at}]}' \
            > reports/arcgpt2-stage01-micro/latest-monitor.json
          cat reports/arcgpt2-stage01-micro/latest-monitor.json

      - name: Publish monitor receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2-stage01-micro/latest-monitor.json
          git commit -m "Record ARC-GPT2 Stage-0.1 micro monitor ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
