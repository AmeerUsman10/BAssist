name: Package Local Transformers Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-transformers-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build relocatable runtime
        run: |
          mkdir runtime
          python -m pip install --upgrade pip
          python -m pip install --target runtime "transformers>=4.48,<6"
          rm -rf runtime/torch runtime/torch-* runtime/numpy runtime/numpy-* runtime/safetensors runtime/safetensors-*
          python - <<'PY'
          import sys
          sys.path.insert(0, "runtime")
          import tokenizers, transformers
          print("transformers", transformers.__version__)
          print("tokenizers", tokenizers.__version__)
          PY
          du -sh runtime
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: transformers-python313-runtime
          path: runtime/
          if-no-files-found: error
          retention-days: 30
