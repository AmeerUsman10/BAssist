name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - "instella_arc/requirements-audit.txt"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - "instella_arc/requirements-audit.txt"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            instella_arc/requirements-audit.txt
            requirements.txt

      - name: Install common test and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [[ -f instella_arc/requirements-audit.txt ]]; then
            grep -v '^torch' instella_arc/requirements-audit.txt > /tmp/requirements-audit-no-torch.txt
            python -m pip install -r /tmp/requirements-audit-no-torch.txt
          else
            python -m pip install pytest
          fi

      - name: Record environment without secrets
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          import os
          import platform
          import torch

          print("platform:", platform.platform())
          print("cpu_count:", os.cpu_count())
          print("torch:", torch.__version__)
          print("cuda_available:", torch.cuda.is_available())
          PY
