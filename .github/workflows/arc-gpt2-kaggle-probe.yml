name: ARC-GPT2 Kaggle Access Probe

on:
  workflow_dispatch:
  push:
    branches: [arc-gpt2-programs]
    paths:
      - ".github/workflows/arc-gpt2-kaggle-probe.yml"

permissions:
  contents: write

concurrency:
  group: arc-gpt2-kaggle-access-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install official Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle

      - name: Probe authentication without exposing credentials
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee kaggle-probe.log
          import json
          import os
          from pathlib import Path

          status = {
              "secret_present": bool(os.environ.get("KAGGLE_API_TOKEN", "").strip()),
              "authenticated": False,
              "error_type": None,
              "error_message": None,
          }

          if not status["secret_present"]:
              status["error_type"] = "MissingSecret"
              status["error_message"] = "GitHub secret KAGGLE_API_TOKEN is not configured."
          else:
              try:
                  from kaggle.api.kaggle_api_extended import KaggleApi

                  api = KaggleApi()
                  api.authenticate()
                  # A tiny public listing forces an authenticated API request while
                  # avoiding writes and avoiding any credential or private-resource output.
                  api.kernels_list(page=1, page_size=1)
                  status["authenticated"] = True
              except Exception as exc:  # recorded without secret values
                  status["error_type"] = type(exc).__name__
                  status["error_message"] = str(exc)[:500]

          Path("kaggle-access-status.json").write_text(
              json.dumps(status, indent=2), encoding="utf-8"
          )
          print(json.dumps(status, indent=2))
          PY

      - name: Publish durable access receipt
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          mkdir -p reports/arcgpt2
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("kaggle-access-status.json")
          details = (
              json.loads(source.read_text(encoding="utf-8"))
              if source.exists()
              else {
                  "secret_present": False,
                  "authenticated": False,
                  "error_type": "ProbeDidNotWriteStatus",
                  "error_message": None,
              }
          )
          receipt = {
              "workflow_outcome": os.environ.get("PROBE_OUTCOME", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              **details,
          }
          Path("reports/arcgpt2/latest-kaggle-access.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2/latest-kaggle-access.json
          git commit -m "Record ARC-GPT2 Kaggle access probe ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
