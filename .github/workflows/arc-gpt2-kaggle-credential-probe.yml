name: ARC-GPT2 Kaggle Credential Formats Probe

on:
  workflow_dispatch:
  push:
    branches: [arc-gpt2-programs]
    paths:
      - ".github/workflows/arc-gpt2-kaggle-credential-probe.yml"

permissions:
  contents: write

concurrency:
  group: arc-gpt2-kaggle-credential-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      KAGGLE_JSON_B64: ${{ secrets.KAGGLE_JSON_B64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install official Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle

      - name: Detect and authenticate available credential format
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee kaggle-credential-probe.log
          import base64
          import json
          import os
          from pathlib import Path

          present = {
              name: bool(os.environ.get(name, "").strip())
              for name in (
                  "KAGGLE_API_TOKEN",
                  "KAGGLE_USERNAME",
                  "KAGGLE_KEY",
                  "KAGGLE_TOKEN",
                  "KAGGLE_JSON_B64",
              )
          }
          status = {
              "credential_presence": present,
              "selected_format": None,
              "authenticated": False,
              "error_type": None,
              "error_message": None,
          }

          try:
              if present["KAGGLE_API_TOKEN"]:
                  status["selected_format"] = "KAGGLE_API_TOKEN"
              elif present["KAGGLE_USERNAME"] and present["KAGGLE_KEY"]:
                  status["selected_format"] = "KAGGLE_USERNAME+KAGGLE_KEY"
              elif present["KAGGLE_TOKEN"]:
                  os.environ["KAGGLE_API_TOKEN"] = os.environ["KAGGLE_TOKEN"]
                  status["selected_format"] = "KAGGLE_TOKEN alias"
              elif present["KAGGLE_JSON_B64"]:
                  config_dir = Path.home() / ".kaggle"
                  config_dir.mkdir(parents=True, exist_ok=True)
                  payload = base64.b64decode(os.environ["KAGGLE_JSON_B64"])
                  path = config_dir / "kaggle.json"
                  path.write_bytes(payload)
                  path.chmod(0o600)
                  status["selected_format"] = "KAGGLE_JSON_B64"
              else:
                  raise RuntimeError("No supported Kaggle credential secret is configured.")

              from kaggle.api.kaggle_api_extended import KaggleApi

              api = KaggleApi()
              api.authenticate()
              api.kernels_list(page=1, page_size=1)
              status["authenticated"] = True
          except Exception as exc:
              status["error_type"] = type(exc).__name__
              message = str(exc)
              # Do not persist any environment value even if a library embeds it
              # in an exception message.
              for name in present:
                  value = os.environ.get(name, "")
                  if value:
                      message = message.replace(value, "[REDACTED]")
              status["error_message"] = message[:500]

          Path("kaggle-credential-status.json").write_text(
              json.dumps(status, indent=2), encoding="utf-8"
          )
          print(json.dumps(status, indent=2))
          PY

      - name: Publish durable access receipt
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          mkdir -p reports/arcgpt2
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("kaggle-credential-status.json")
          details = (
              json.loads(source.read_text(encoding="utf-8"))
              if source.exists()
              else {
                  "credential_presence": {},
                  "selected_format": None,
                  "authenticated": False,
                  "error_type": "ProbeDidNotWriteStatus",
                  "error_message": None,
              }
          )
          receipt = {
              "workflow_outcome": os.environ.get("PROBE_OUTCOME", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              **details,
          }
          Path("reports/arcgpt2/latest-kaggle-credential-formats.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2/latest-kaggle-credential-formats.json
          git commit -m "Record Kaggle credential probe ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
