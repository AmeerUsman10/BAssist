name: ARC-GPT2 EGGROLL Inner Memory GPU

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-gpt2-eggroll-inner-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused CPU dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet --disable-pip-version-check \
            "transformers==4.57.6" "safetensors==0.6.2" "pytest==8.4.2"

      - name: Run EGGROLL and dependency tests
        run: |
          python -m pytest -q \
            arcgpt2/tests/test_eggroll_inner_memory.py \
            arcgpt2/tests/test_meta_soft_heldout_binding.py \
            arcgpt2/tests/test_completion_scorer.py

      - name: Verify frozen runner contract
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          runner = Path("kaggle/arc-gpt2-eggroll-inner-memory-gpu/runner.py")
          source = runner.read_text(encoding="utf-8")
          needle = 'SOURCE_SHA = "__SOURCE_SHA__"'
          assert source.count(needle) == 1
          injected = source.replace(needle, f'SOURCE_SHA = "{os.environ["WORKFLOW_SHA"]}"')
          target = Path("/tmp/eggroll-runner-preflight.py")
          target.write_text(injected, encoding="utf-8")
          spec = importlib.util.spec_from_file_location("eggroll_runner", target)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.validate_source_sha(module.SOURCE_SHA)
          assert module.PROTOCOL == "eggroll_inner_memory_v1"
          assert module.GPT2_REVISION == "607a30d783dfa663caf39e06633721c8d4cfcd7e"
          assert module.RUNNER_SCHEMA_VERSION == 1
          PY

  dispatch:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned official Kaggle CLI
        run: python -m pip install --quiet --disable-pip-version-check "kaggle==2.2.2"

      - name: Authenticate, run private GPU gate, and retrieve evidence
        id: kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p kaggle-output dispatch-evidence

          write_state() {
            ARC_STATE="$1" ARC_DETAIL="${2:-}" python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("dispatch-evidence/workflow-state.json")
          current = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          current.update({
              "state": os.environ["ARC_STATE"],
              "detail": os.environ.get("ARC_DETAIL") or None,
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "kernel_slug": os.environ.get("KAGGLE_KERNEL_SLUG"),
          })
          private_ref = os.environ.get("PRIVATE_KERNEL_REF", "")
          if private_ref:
              current["kernel_ref_sha256"] = hashlib.sha256(private_ref.encode()).hexdigest()
          path.write_text(json.dumps(current, indent=2), encoding="utf-8")
          PY
          }

          redact_file() {
            REDACT_SOURCE="$1" REDACT_TARGET="$2" REDACT_OWNER="${owner:-}" python - <<'PY'
          import os
          from pathlib import Path
          import re

          source = Path(os.environ["REDACT_SOURCE"])
          target = Path(os.environ["REDACT_TARGET"])
          text = source.read_text(encoding="utf-8", errors="replace") if source.exists() else ""
          owner = os.environ.get("REDACT_OWNER", "")
          if owner:
              text = text.replace(owner, "[REDACTED_OWNER]")
          text = re.sub(r"KGAT_[A-Za-z0-9_-]+", "[REDACTED_TOKEN]", text)
          with target.open("a", encoding="utf-8") as handle:
              handle.write(text)
              if text and not text.endswith("\n"):
                  handle.write("\n")
          PY
          }

          fail() {
            write_state failed "$1"
            echo "EGGROLL Kaggle dispatch failed: $1"
            exit 1
          }

          [[ -n "${KAGGLE_API_TOKEN:-}" ]] || fail "KAGGLE_API_TOKEN is not configured"
          write_state authenticating
          if ! kaggle kernels list --mine --page-size 100 --csv > "${RUNNER_TEMP}/mine.csv" 2> "${RUNNER_TEMP}/auth.err"; then
            redact_file "${RUNNER_TEMP}/auth.err" dispatch-evidence/dispatch-redacted.log
            fail "Kaggle authentication or private kernel listing failed"
          fi
          owner="$({ python - "${RUNNER_TEMP}/mine.csv" <<'PY'
          import csv
          import re
          import sys

          with open(sys.argv[1], newline="", encoding="utf-8") as handle:
              for row in csv.reader(handle):
                  for value in row:
                      if "/" not in value:
                          continue
                      candidate = value.split("/", 1)[0].strip()
                      if re.fullmatch(r"[A-Za-z0-9_-]+", candidate) and candidate.lower() not in {"ref", "kernelref"}:
                          print(candidate)
                          raise SystemExit(0)
          raise SystemExit("No owned kernel reference was returned")
          PY
          } 2> "${RUNNER_TEMP}/owner.err")" || fail "Could not resolve authenticated Kaggle owner"
          [[ "$owner" =~ ^[A-Za-z0-9_-]+$ ]] || fail "Resolved Kaggle owner has invalid shape"
          export KAGGLE_KERNEL_SLUG="arc-gpt2-eggroll-inner-memory-${GITHUB_SHA:0:8}"
          export PRIVATE_KERNEL_REF="${owner}/${KAGGLE_KERNEL_SLUG}"
          printf 'resolved_owner_sha256=%s\n' "$(printf '%s' "$owner" | sha256sum | cut -d' ' -f1)" >> dispatch-evidence/dispatch-redacted.log

          stage="${RUNNER_TEMP}/${KAGGLE_KERNEL_SLUG}"
          mkdir -p "$stage"
          RUNNER_SOURCE=kaggle/arc-gpt2-eggroll-inner-memory-gpu/runner.py \
          RUNNER_TARGET="${stage}/runner.py" python - <<'PY' || fail "Exact source SHA injection failed"
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_SOURCE"]).read_text(encoding="utf-8")
          needle = 'SOURCE_SHA = "__SOURCE_SHA__"'
          if source.count(needle) != 1:
              raise SystemExit("expected exactly one source SHA placeholder")
          injected = source.replace(needle, f'SOURCE_SHA = "{os.environ["GITHUB_SHA"]}"')
          if "__SOURCE_SHA__" in injected:
              raise SystemExit("unresolved source SHA placeholder remains")
          Path(os.environ["RUNNER_TARGET"]).write_text(injected, encoding="utf-8")
          PY
          PRIVATE_OWNER="$owner" STAGE="$stage" python - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ["STAGE"])
          metadata = {
              "id": f"{os.environ['PRIVATE_OWNER']}/{os.environ['KAGGLE_KERNEL_SLUG']}",
              "title": f"ARC GPT2 EGGROLL Inner Memory {os.environ['GITHUB_SHA'][:8]}",
              "code_file": "runner.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          (stage / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          PY
          staged_runner_sha="$(sha256sum "${stage}/runner.py" | cut -d' ' -f1)"
          write_state staged

          # A source-derived slug should be absent. Reuse only an exact completed
          # runner, and never replace a different running source.
          reuse_complete=false
          resume_running=false
          if kaggle kernels status "$PRIVATE_KERNEL_REF" > "${RUNNER_TEMP}/existing-status.log" 2>&1; then
            existing_text="$(tr '[:upper:]' '[:lower:]' < "${RUNNER_TEMP}/existing-status.log")"
            rm -rf "${RUNNER_TEMP}/existing-source"
            mkdir -p "${RUNNER_TEMP}/existing-source"
            existing_match=false
            if kaggle kernels pull "$PRIVATE_KERNEL_REF" -p "${RUNNER_TEMP}/existing-source" --metadata > "${RUNNER_TEMP}/existing-pull.log" 2>&1; then
              existing_runner="$(find "${RUNNER_TEMP}/existing-source" -name runner.py -type f | head -n 1)"
              if [[ -n "$existing_runner" && "$(sha256sum "$existing_runner" | cut -d' ' -f1)" == "$staged_runner_sha" ]]; then
                existing_match=true
              fi
            fi
            if grep -Eq 'running|queued' <<< "$existing_text"; then
              [[ "$existing_match" == "true" ]] || fail "Different source is running under derived slug"
              resume_running=true
            elif grep -Eq 'complete|success' <<< "$existing_text" && [[ "$existing_match" == "true" ]]; then
              if kaggle kernels output "$PRIVATE_KERNEL_REF" -p kaggle-output --force --quiet > "${RUNNER_TEMP}/existing-output.log" 2>&1; then
                reuse_complete=true
              fi
            fi
          fi

          if [[ "$reuse_complete" != "true" && "$resume_running" != "true" ]]; then
            write_state pushing
            if ! kaggle kernels push -p "$stage" --accelerator NvidiaTeslaT4 --timeout 10800 > "${RUNNER_TEMP}/push.log" 2>&1; then
              redact_file "${RUNNER_TEMP}/push.log" dispatch-evidence/dispatch-redacted.log
              fail "Kaggle kernel push failed"
            fi
            redact_file "${RUNNER_TEMP}/push.log" dispatch-evidence/dispatch-redacted.log
          fi

          if [[ "$reuse_complete" != "true" ]]; then
            write_state running
            deadline=$((SECONDS + 10800))
            completed=false
            status_failures=0
            while (( SECONDS < deadline )); do
              if ! kaggle kernels status "$PRIVATE_KERNEL_REF" > "${RUNNER_TEMP}/status.log" 2>&1; then
                status_failures=$((status_failures + 1))
                redact_file "${RUNNER_TEMP}/status.log" dispatch-evidence/dispatch-redacted.log
                (( status_failures < 5 )) || fail "Kaggle status query failed five times"
                sleep 20
                continue
              fi
              status_failures=0
              status_text="$(tr '[:upper:]' '[:lower:]' < "${RUNNER_TEMP}/status.log")"
              if grep -Eq 'complete|success' <<< "$status_text"; then
                completed=true
                break
              fi
              if grep -Eq 'error|failed|cancel' <<< "$status_text"; then
                kaggle kernels output "$PRIVATE_KERNEL_REF" -p kaggle-output --force --quiet > "${RUNNER_TEMP}/failed-output.log" 2>&1 || true
                fail "Kaggle kernel terminated unsuccessfully"
              fi
              sleep 20
            done
            [[ "$completed" == "true" ]] || fail "Kaggle kernel exceeded the three-hour ceiling"
            output_retrieved=false
            for output_attempt in 1 2 3 4 5; do
              if kaggle kernels output "$PRIVATE_KERNEL_REF" -p kaggle-output --force --quiet > "${RUNNER_TEMP}/output.log" 2>&1; then
                output_retrieved=true
                break
              fi
              sleep 20
            done
            if [[ "$output_retrieved" != "true" ]]; then
              redact_file "${RUNNER_TEMP}/output.log" dispatch-evidence/dispatch-redacted.log
              fail "Kaggle output download failed after five attempts"
            fi
          fi

          STAGED_RUNNER_SHA="$staged_runner_sha" python - <<'PY' || fail "Downloaded evidence failed provenance checks"
          import hashlib
          import json
          import os
          from pathlib import Path

          results = list(Path("kaggle-output").rglob("eggroll-result.json"))
          if len(results) != 1:
              raise SystemExit(f"expected one result, found {len(results)}")
          result_path = results[0]
          root = result_path.parent.parent
          receipt_path = root / "receipt.json"
          artifact_path = root / "artifact-manifest.json"
          if not receipt_path.is_file() or not artifact_path.is_file():
              raise SystemExit("co-rooted receipt or artifact manifest is missing")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          expected = os.environ["GITHUB_SHA"]
          if result.get("source_sha") != expected or receipt.get("source_sha") != expected:
              raise SystemExit("source SHA mismatch")
          if result.get("protocol") != "eggroll_inner_memory_v1":
              raise SystemExit("protocol mismatch")
          execution = result.get("execution_checks", {})
          if not execution or not all(execution.values()):
              raise SystemExit("execution contract failed")
          if result.get("competition_submission_performed") is not False:
              raise SystemExit("competition boundary mismatch")
          if result.get("model_weights_persisted") is not False:
              raise SystemExit("model persistence boundary mismatch")
          result_hash = hashlib.sha256(result_path.read_bytes()).hexdigest()
          if receipt.get("result_sha256") != result_hash:
              raise SystemExit("runner receipt does not hash the result")
          if receipt.get("runner_source_sha256") != os.environ["STAGED_RUNNER_SHA"]:
              raise SystemExit("runner receipt does not hash the staged runner")
          recorded = artifact.get("files", {})
          result_key = str(result_path.relative_to(root))
          receipt_key = str(receipt_path.relative_to(root))
          if recorded.get(result_key, {}).get("sha256") != result_hash:
              raise SystemExit("artifact manifest does not hash the result")
          if recorded.get(receipt_key, {}).get("sha256") != hashlib.sha256(receipt_path.read_bytes()).hexdigest():
              raise SystemExit("artifact manifest does not hash the runner receipt")
          Path("dispatch-evidence/kernel-root.txt").write_text(str(root), encoding="utf-8")
          PY
          write_state outputs_retrieved

      - name: Build durable redacted receipt
        if: always()
        env:
          DISPATCH_OUTCOME: ${{ steps.kaggle.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          target = Path("reports/arcgpt2/kaggle-eggroll-inner-memory/latest")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)
          candidates = list(Path("kaggle-output").rglob("eggroll-result.json"))
          failures = list(Path("kaggle-output").rglob("failure.json"))
          source = (
              candidates[0].parent.parent
              if len(candidates) == 1
              else failures[0].parent if len(failures) == 1 else None
          )
          if source and source.is_dir():
              for name in (
                  "environment.json",
                  "model-manifest.json",
                  "receipt.json",
                  "artifact-manifest.json",
                  "failure.json",
              ):
                  path = source / name
                  if path.exists():
                      destination = "kernel-artifact-manifest.json" if name == "artifact-manifest.json" else name
                      shutil.copy2(path, target / destination)
              if candidates:
                  shutil.copy2(candidates[0], target / "eggroll-result.json")
          state_path = Path("dispatch-evidence/workflow-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          result_path = target / "eggroll-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {}
          hashes = {
              str(path.relative_to("kaggle-output")): {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in sorted(Path("kaggle-output").rglob("*"))
              if path.is_file()
          }
          receipt = {
              "status": "completed" if os.environ.get("DISPATCH_OUTCOME") == "success" else "execution_failed",
              "dispatch_outcome": os.environ.get("DISPATCH_OUTCOME"),
              "scope": "Private EGGROLL inner-memory compatibility gate; no competition submission.",
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "kernel_source_sha": result.get("source_sha"),
              "protocol": result.get("protocol"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "kernel_slug": state.get("kernel_slug"),
              "kernel_ref_sha256": state.get("kernel_ref_sha256"),
              "final_dispatch_state": state.get("state"),
              "dispatch_detail": state.get("detail"),
              "accelerator_requested": "NvidiaTeslaT4",
              "dual_t4_required_by_runner": True,
              "gate_passed": result.get("gate", {}).get("passed") is True,
              "decision": result.get("decision"),
              "competition_submission_performed": result.get("competition_submission_performed"),
              "model_weights_persisted": result.get("model_weights_persisted"),
              "output_files": hashes,
          }
          (target / "workflow-receipt.json").write_text(json.dumps(receipt, indent=2), encoding="utf-8")
          PY

      - name: Publish evidence from a fresh branch tip
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          publish_dir="$(mktemp -d)"
          git worktree add --detach "$publish_dir" "origin/${GITHUB_REF_NAME}"
          PUBLISH_DIR="$publish_dir" python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path("reports/arcgpt2/kaggle-eggroll-inner-memory/latest")
          target = Path(os.environ["PUBLISH_DIR"]) / source
          if target.exists():
              shutil.rmtree(target)
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, target)
          PY
          cd "$publish_dir"
          git add reports/arcgpt2/kaggle-eggroll-inner-memory/latest
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record ARC-GPT2 EGGROLL inner-memory ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Upload full execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-gpt2-eggroll-inner-memory-${{ github.run_id }}
          path: |
            reports/arcgpt2/kaggle-eggroll-inner-memory/latest/
            kaggle-output/
            dispatch-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Propagate execution failure
        if: steps.kaggle.outcome != 'success'
        run: exit 1
