name: ARC-GPT2 Three-Task Epistemic Smoke

on:
  workflow_dispatch:
  push:
    branches: [arc-gpt2-programs]
    paths:
      - "arcgpt2/build_joint_epistemic_v2.py"
      - "arcgpt2/compare_joint_epistemic_v2.py"
      - "arcgpt2/tests/test_joint_epistemic_v2.py"
      - ".github/workflows/arc-gpt2-joint-v2-smoke.yml"

permissions:
  contents: write

concurrency:
  group: arc-gpt2-joint-v2-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4" pytest

      - name: Run matched three-task smoke
        id: experiment
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pytest -q arcgpt2/tests
            python -m arcgpt2.build_joint_epistemic_v2 \
              --output-dir outputs/joint_v2_smoke/data \
              --train-action-groups 1 \
              --validation-action-groups 1 \
              --test-action-groups 1 \
              --train-goal-games 1 \
              --validation-goal-games 1 \
              --test-goal-games 1 \
              --train-contact-groups 1 \
              --validation-contact-groups 1 \
              --test-contact-groups 1 \
              --mapping-variants 2 \
              --action-seed-base 818034 \
              --goal-seed-base 341421 \
              --contact-seed-base 2718282
            python -m arcgpt2.train_joint_epistemic \
              --initialization pretrained \
              --data-dir outputs/joint_v2_smoke/data \
              --output-dir outputs/joint_v2_smoke/pretrained \
              --max-length 512 \
              --prefix-keep 96 \
              --gradient-accumulation-steps 3 \
              --learning-rate 0.0001 \
              --max-optimizer-steps 2 \
              --warmup-steps 1 \
              --freeze-first-n-blocks 11 \
              --candidate-batch-size 5 \
              --evaluation-rows-per-task 4 \
              --no-save-model
            python -m arcgpt2.train_joint_epistemic \
              --initialization random \
              --data-dir outputs/joint_v2_smoke/data \
              --output-dir outputs/joint_v2_smoke/random \
              --max-length 512 \
              --prefix-keep 96 \
              --gradient-accumulation-steps 3 \
              --learning-rate 0.0001 \
              --max-optimizer-steps 2 \
              --warmup-steps 1 \
              --freeze-first-n-blocks 11 \
              --candidate-batch-size 5 \
              --evaluation-rows-per-task 4 \
              --no-save-model
            python -m arcgpt2.compare_joint_epistemic_v2 \
              --pretrained outputs/joint_v2_smoke/pretrained/summary.json \
              --random outputs/joint_v2_smoke/random/summary.json \
              --output outputs/joint_v2_smoke/comparison.json
          } 2>&1 | tee joint-v2-smoke.log

      - name: Write durable evidence
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          mkdir -p reports/arcgpt2
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/arcgpt2")
          outputs = Path("outputs/joint_v2_smoke")
          receipt = {
              "status": os.environ.get("EXPERIMENT_OUTCOME", "unknown"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "scope": (
                  "CPU smoke for one GPT-2 jointly scoring action semantics, "
                  "goals, and contact mechanics; not ARC-AGI-3 evaluation"
              ),
          }
          (reports / "latest-joint-v2-smoke-status.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          copies = {
              outputs / "data" / "manifest.json": reports / "latest-joint-v2-smoke-data.json",
              outputs / "pretrained" / "summary.json": reports / "latest-joint-v2-smoke-pretrained.json",
              outputs / "random" / "summary.json": reports / "latest-joint-v2-smoke-random.json",
              outputs / "comparison.json": reports / "latest-joint-v2-smoke-comparison.json",
          }
          for source, target in copies.items():
              if source.exists():
                  shutil.copy2(source, target)
          log = Path("joint-v2-smoke.log")
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              (reports / "latest-joint-v2-smoke-log-tail.txt").write_text(
                  "\n".join(lines[-1800:]) + "\n", encoding="utf-8"
              )
          PY

      - name: Publish evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2/
          git commit -m "Record three-task GPT-2 smoke ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Propagate failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
