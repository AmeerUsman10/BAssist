name: Instella ARC Static Audit

on:
  workflow_dispatch:
  push:
    branches: [instella-arc]
    paths:
      - "instella_arc/**"
      - "arcgpt2/codec_text.py"
      - "arcgpt2/official_observation.py"
      - "arcgpt2/tests/test_official_observation.py"
      - ".github/workflows/instella-arc-static-audit.yml"

permissions:
  contents: write

concurrency:
  group: instella-arc-static-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: instella_arc/requirements-audit.txt

      - name: Install CPU audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch' instella_arc/requirements-audit.txt > /tmp/requirements-audit-no-torch.txt
          python -m pip install -r /tmp/requirements-audit-no-torch.txt

      - name: Run deterministic tests, architecture audit, and adapter plan
        id: audit
        continue-on-error: true
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -o pipefail
          {
            python -m pytest -q instella_arc/tests arcgpt2/tests
            python -m instella_arc.audit \
              --checkpoints base dpo think \
              --output outputs/instella_arc/audit.json \
              --markdown outputs/instella_arc/audit.md
            python -m instella_arc.lora_plan \
              --checkpoint dpo \
              --ranks 4 8 16 \
              --output outputs/instella_arc/lora-plan.json
          } 2>&1 | tee instella-static-audit.log

      - name: Write durable receipt
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          mkdir -p reports/instella_arc
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          report_dir = Path('reports/instella_arc')
          output_json = Path('outputs/instella_arc/audit.json')
          output_md = Path('outputs/instella_arc/audit.md')
          lora_plan = Path('outputs/instella_arc/lora-plan.json')
          log = Path('instella-static-audit.log')
          receipt = {
              'status': os.environ.get('AUDIT_OUTCOME', 'unknown'),
              'branch': os.environ.get('GITHUB_REF_NAME'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'weight_downloaded': False,
              'audit_present': output_json.exists(),
              'audit_sha256': digest(output_json) if output_json.exists() else None,
              'lora_plan_present': lora_plan.exists(),
              'lora_plan_sha256': digest(lora_plan) if lora_plan.exists() else None,
          }
          (report_dir / 'latest-static-status.json').write_text(
              json.dumps(receipt, indent=2), encoding='utf-8'
          )
          if output_json.exists():
              shutil.copy2(output_json, report_dir / 'latest-audit.json')
          if output_md.exists():
              shutil.copy2(output_md, report_dir / 'latest-audit.md')
          if lora_plan.exists():
              shutil.copy2(lora_plan, report_dir / 'latest-lora-plan.json')
          if log.exists():
              lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
              (report_dir / 'latest-static-log-tail.txt').write_text(
                  '\n'.join(lines[-1400:]) + '\n', encoding='utf-8'
              )
          PY

      - name: Publish receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/instella_arc/
          git commit -m "Record Instella ARC static audit ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instella-arc-static-audit
          path: |
            reports/instella_arc/
            outputs/instella_arc/audit.json
            outputs/instella_arc/audit.md
            outputs/instella_arc/lora-plan.json
            instella-static-audit.log
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate audit failure
        if: steps.audit.outcome != 'success'
        run: exit 1
