name: ARC-GPT2 Stage 0.2 Natural Mapping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arc-gpt2-stage02-natural-mapping.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-gpt2-stage02-natural-mapping
  cancel-in-progress: true

jobs:
  natural-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4" pytest
      - name: Run natural-token mapping diagnostic
        id: experiment
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONHASHSEED: "42"
        run: |
          set -o pipefail
          {
            python -m pytest -q \
              arcgpt2/tests/test_stage02.py \
              arcgpt2/tests/test_stage02_sparse.py \
              arcgpt2/tests/test_stage02_natural.py
            python -m arcgpt2.stage02_natural \
              --output-dir outputs/stage02-natural/data \
              --train-games 1 \
              --validation-games 1 \
              --test-games 1 \
              --train-seed-start 0 \
              --validation-seed-start 0 \
              --test-seed-start 20
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/stage02-natural/data")
          for name in ("train", "validation"):
              source = root / f"{name}.jsonl"
              target = root / f"{name}-mapping.jsonl"
              rows = [
                  json.loads(line)
                  for line in source.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
              rows = [row for row in rows if row.get("task") == "mapping"]
              target.write_text(
                  "".join(json.dumps(row, sort_keys=True) + "\n" for row in rows),
                  encoding="utf-8",
              )
              print(name, "mapping rows", len(rows))
          PY
            python -m arcgpt2.train_stage02_natural \
              --train-file outputs/stage02-natural/data/train-mapping.jsonl \
              --evaluation-file outputs/stage02-natural/data/validation-mapping.jsonl \
              --output-dir outputs/stage02-natural/pretrained \
              --max-length 384 \
              --prefix-keep 192 \
              --train-batch-size 16 \
              --eval-batch-size 16 \
              --gradient-accumulation-steps 1 \
              --learning-rate 2e-4 \
              --max-optimizer-steps 128 \
              --warmup-steps 8 \
              --freeze-first-n-blocks 10 \
              --train-eval-seed-start 0 \
              --train-eval-games 1 \
              --heldout-seed-start 20 \
              --heldout-games 1 \
              --max-actions-per-game 1 \
              --history-modes intact
          } 2>&1 | tee stage02-natural-mapping.log
      - name: Write durable evidence
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          python -m arcgpt2.report_experiment \
            --report-dir reports/arcgpt2-stage02-natural-mapping \
            --summary outputs/stage02-natural/pretrained/summary.json \
            --manifest outputs/stage02-natural/data/manifest.json \
            --log stage02-natural-mapping.log \
            --scope "One-game compact natural-token mapping overfit diagnostic; not an ARC score"
      - name: Publish evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2-stage02-natural-mapping/
          git commit -m "Record ARC-GPT2 natural mapping run ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-gpt2-stage02-natural-mapping-evidence
          path: |
            reports/arcgpt2-stage02-natural-mapping/
            stage02-natural-mapping.log
          if-no-files-found: warn
          retention-days: 14
      - name: Propagate failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
