name: ARC-GPT2 Stage 0.3 Components

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arc-gpt2-stage03-components.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-gpt2-stage03-components
  cancel-in-progress: true

jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.48,<6" "safetensors>=0.4" pytest
      - name: Run component diagnostics
        id: experiment
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONHASHSEED: "42"
        run: |
          set -o pipefail
          {
            python -m pytest -q \
              arcgpt2/tests/test_stage02_sparse.py \
              arcgpt2/tests/test_stage02_natural.py \
              arcgpt2/tests/test_stage03_components.py

            python -m arcgpt2.stage03_components \
              --output-dir outputs/stage03-components/data \
              --train-seed-start 0 \
              --train-games 24 \
              --validation-seed-start 24 \
              --validation-games 8 \
              --test-seed-start 100 \
              --test-games 8 \
              --variants 8

            python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/stage03-components/data")
          for split in ("train", "validation"):
              rows = [
                  json.loads(line)
                  for line in (root / f"{split}.jsonl").read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
              for task in ("mapping", "need", "compose", "direct"):
                  selected = [row for row in rows if row.get("task") == task]
                  (root / f"{split}-{task}.jsonl").write_text(
                      "".join(json.dumps(row, sort_keys=True) + "\n" for row in selected),
                      encoding="utf-8",
                  )
                  print(split, task, len(selected))
          PY

            for task in mapping need compose direct; do
              case "$task" in
                mapping) steps=160 ;;
                need) steps=80 ;;
                compose) steps=60 ;;
                direct) steps=120 ;;
              esac
              python -m arcgpt2.train_stage03_component \
                --train-file "outputs/stage03-components/data/train-${task}.jsonl" \
                --evaluation-file "outputs/stage03-components/data/validation-${task}.jsonl" \
                --output-dir "outputs/stage03-components/${task}" \
                --max-length 256 \
                --prefix-keep 128 \
                --train-batch-size 16 \
                --eval-batch-size 32 \
                --gradient-accumulation-steps 1 \
                --learning-rate 2e-4 \
                --max-optimizer-steps "$steps" \
                --warmup-steps 8 \
                --freeze-first-n-blocks 10 \
                --train-eval-seed-start 0 \
                --train-eval-games 1 \
                --heldout-seed-start 100 \
                --heldout-games 1 \
                --max-actions-per-game 1 \
                --history-modes intact
            done

            python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/stage03-components")
          tasks = ("mapping", "need", "compose", "direct")
          thresholds = {
              "mapping": 0.90,
              "need": 0.90,
              "compose": 0.98,
              "direct": 0.90,
          }
          comparison = {
              "status": "completed",
              "scope": (
                  "Stage-0.3 synthetic isolated GPT-2 components; not a closed-loop "
                  "agent and not an ARC-AGI-3 score"
              ),
              "components": {},
              "gates": {},
          }
          for task in tasks:
              summary = json.loads(
                  (root / task / "summary.json").read_text(encoding="utf-8")
              )
              initial = summary["initial_classification"]["by_task"][task]
              final = summary["final_classification"]["by_task"][task]
              comparison["components"][task] = {
                  "train_examples": summary["train_examples"],
                  "validation_examples": summary["evaluation_examples"],
                  "initial_loss": summary["initial_classification"]["loss"],
                  "final_loss": summary["final_classification"]["loss"],
                  "initial_accuracy": initial["accuracy"],
                  "final_accuracy": final["accuracy"],
                  "predicted_counts": final["predicted_counts"],
                  "target_counts": final["target_counts"],
                  "dominant_prediction_share": final["dominant_prediction_share"],
                  "prediction_distribution_entropy": final["prediction_distribution_entropy"],
                  "elapsed_seconds": summary["elapsed_seconds"],
              }
              comparison["gates"][f"{task}_accuracy_at_least_{thresholds[task]:.2f}"] = (
                  final["accuracy"] >= thresholds[task]
              )
              comparison["gates"][f"{task}_not_collapsed"] = (
                  final["dominant_prediction_share"] < 0.80
              )
          comparison["gates"]["stage03_component_gate_passed"] = all(
              comparison["gates"].values()
          )
          Path("outputs/stage03-components/comparison.json").write_text(
              json.dumps(comparison, indent=2), encoding="utf-8"
          )
          print(json.dumps(comparison, indent=2))
          PY
          } 2>&1 | tee stage03-components.log
      - name: Write durable component receipt
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          mkdir -p reports/arcgpt2-stage03-components
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/arcgpt2-stage03-components")
          comparison_path = Path("outputs/stage03-components/comparison.json")
          manifest_path = Path("outputs/stage03-components/data/manifest.json")
          comparison = None
          if comparison_path.exists():
              comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
              shutil.copy2(comparison_path, reports / "latest-comparison.json")
          if manifest_path.exists():
              shutil.copy2(manifest_path, reports / "latest-data-manifest.json")
          for task in ("mapping", "need", "compose", "direct"):
              source = Path(f"outputs/stage03-components/{task}/summary.json")
              if source.exists():
                  shutil.copy2(source, reports / f"latest-{task}-summary.json")
          log = Path("stage03-components.log")
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              (reports / "latest-log-tail.txt").write_text(
                  "\n".join(lines[-1000:]) + "\n", encoding="utf-8"
              )
          receipt = {
              "execution_status": os.environ.get("EXPERIMENT_OUTCOME", "unknown"),
              "capability_gate": (
                  "passed"
                  if comparison and comparison.get("gates", {}).get("stage03_component_gate_passed")
                  else "not_yet_passed" if comparison else "not_evaluated"
              ),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "scope": "Stage-0.3 isolated pure GPT-2 components; not an ARC score",
          }
          (reports / "latest-status.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          PY
      - name: Publish component receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/arcgpt2-stage03-components/
          git commit -m "Record ARC-GPT2 Stage-0.3 components ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-gpt2-stage03-components-evidence
          path: |
            reports/arcgpt2-stage03-components/
            stage03-components.log
          if-no-files-found: warn
          retention-days: 21
      - name: Propagate execution failure
        if: steps.experiment.outcome != 'success'
        run: exit 1
