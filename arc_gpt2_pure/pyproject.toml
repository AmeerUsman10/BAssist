[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-gpt2-pure"
version = "0.1.0"
description = "A pure GPT-2 in-context learning experiment for ARC-AGI-3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
  "transformers>=4.48,<6",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arc_gpt2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
